name: test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Bun test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6 # Node.js 24 compatible

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Types
        run: bun --check

      - name: Check formatting
        run: bun run fmt:check

      - name: Run tests
        run: bun run test:start
